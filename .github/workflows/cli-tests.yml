name: Docker Scout CLI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  scout-cli-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell
        shell: bash

      - name: Install Docker Scout CLI
        run: |
          curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --
        shell: bash

      - name: Show Docker and Scout versions
        run: |
          docker version
          docker scout version
        shell: bash

      - name: Run Docker Scout CLI tests (run_all.ps1)
        run: |
          pwsh ./tests/run_all.ps1
        shell: bash

      # 👇 NUEVO: preparar Go para las pruebas de integración
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run integration tests (go test ./integration-tests)
        run: go test ./integration-tests
        shell: bash
