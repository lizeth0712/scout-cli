name: Docker Scout CLI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  scout-cli-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker Scout CLI
        run: |
          curl -L https://github.com/docker/scout-cli/releases/latest/download/install.sh -o install.sh
          chmod +x install.sh
          ./install.sh
        shell: bash

      - name: Show Docker and Scout versions
        run: |
          docker version
          docker scout version
        shell: bash

      # Paso opcional para verificar que pwsh existe (útil para debug)
      - name: Check PowerShell availability
        run: |
          which pwsh || echo "pwsh not found"
        shell: bash

      - name: Run Docker Scout CLI tests (run_all.ps1)
        run: |
          pwsh ./tests/run_all.ps1
        shell: bash
